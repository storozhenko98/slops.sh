name: ci-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test-web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://cggfuwkuawjuocdlfegy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T5Qxap4GNqCQi7NauCjt7w_bK8tor_1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  build-cli:
    needs: test-web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: slops-linux-x64
          - os: macos-13
            artifact: slops-macos-x64
          - os: macos-14
            artifact: slops-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Resolve CLI version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "SLOPS_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Write CLI version
        run: bun scripts/write-cli-version.ts "$SLOPS_VERSION"
      - run: bun run cli:compile
      - run: mv packages/cli/dist/slops ${{ matrix.artifact }}
      - run: chmod +x ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  rolling-release:
    needs: build-cli
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Resolve release metadata
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="$GITHUB_REF_NAME"
            RELEASE_LATEST="--latest"
            RELEASE_NOTES="Version $VERSION CLI build from $GITHUB_SHA."
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="latest"
            RELEASE_TITLE="latest ($VERSION)"
            RELEASE_LATEST="--latest=false"
            RELEASE_NOTES="Rolling latest CLI build $VERSION from $GITHUB_SHA."
          fi
          echo "SLOPS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"
          echo "RELEASE_LATEST=$RELEASE_LATEST" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> "$GITHUB_ENV"
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -maxdepth 2 -type f -name 'slops-*' -exec cp {} release-assets/ \;
          chmod +x release-assets/slops-*
          bun scripts/create-cli-manifest.ts "$SLOPS_VERSION" "$RELEASE_TAG" "$GITHUB_SHA" release-assets release-assets/slops-version.json
      - name: Replace rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$RELEASE_TAG"
          release-assets/*
          $RELEASE_LATEST
          --target "$GITHUB_SHA"
          --title "$RELEASE_TITLE"
          --notes "$RELEASE_NOTES"
